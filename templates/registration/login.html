{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="form-box">
  <h1>Connexion</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Se connecter</button>
  </form>
  <p class="small">Pas de compte ? <a href="{% url 'signup' %}">Inscris-toi</a>.</p>
</div>
{% endblock %}
